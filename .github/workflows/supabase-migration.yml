name: Supabase Database Migration Automation

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'supabase_schema.sql'
      - '.github/workflows/supabase-migration.yml'

jobs:
  deploy-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PostgreSQL Client & Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply Supabase Schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "Applying schema via Supabase Connection Pooler..."
            psql "$SUPABASE_DB_URL" -f supabase_schema.sql
          elif [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Linking project via Supabase CLI..."
            supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
            supabase db execute --file supabase_schema.sql
          else
            echo "::error::Neither SUPABASE_DB_URL nor SUPABASE_ACCESS_TOKEN is set in GitHub Secrets."
            echo "Please set SUPABASE_ACCESS_TOKEN (Personal Access Token) or SUPABASE_DB_URL (Supavisor IPv4 Pooler URL) in repository secrets."
            exit 1
          fi
